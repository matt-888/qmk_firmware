name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
      #volumes:
      #  - ${{ github.workspace }}/output:/output

    steps:

    - name: Checkout source
      uses: actions/checkout@v6
      with:
        submodules: recursive
      #ref: ${{ inputs.version }}

    - name: Install missing python modules
      run: /usr/bin/python3 -m pip install -r $GITHUB_WORKSPACE/requirements.txt

   # - name: Make firmware
   #   run: |
   #     make keyball/${{ inputs.keyboard }}:${{ inputs.keymap }} -j8
   #     find / -name "*.uf2" 2>/dev/null
   #     mount | grep output
   #     pwd
   #     mkdir -p /output/ ; cp /__w/qmk_firmware/qmk_firmware/.build/*.uf2 /output/

    - name: Make firmware
      run: |
        make keyball/${{ inputs.keyboard }}:${{ inputs.keymap }} -j8
        mkdir -p /__w/qmk_firmware/qmk_firmware/output
        cp /__w/qmk_firmware/qmk_firmware/.build/*.uf2 /__w/qmk_firmware/qmk_firmware/output/
    
    - name: List files in .build
      run: |
        ls -la $GITHUB_WORKSPACE/.build
        ls -la $GITHUB_WORKSPACE
        pwd
        echo $GITHUB_WORKSPACE
        echo ${{ github.workspace }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: /__w/qmk_firmware/qmk_firmware/.build/*.uf2
        include-hidden-files: true

