name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:

    - name: Checkout source
      uses: actions/checkout@v6
      submodules: recursive
      #ref: ${{ inputs.version }}
      
    - name: List files in workspace
      run: ls -la $GITHUB_WORKSPACE

    - name: Install missing python modules
      run: /usr/bin/python3 -m pip install -r $GITHUB_WORKSPACE/requirements.txt

    - name: Compile and link
      run: make keyball/${{ inputs.keyboard }}:${{ inputs.keymap }} -j8

    - name: Archive built firmware
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: $GITHUB_WORKSPACE/*.uf2
